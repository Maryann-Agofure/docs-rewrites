name: Vale Linting
on:
  pull_request:
    paths:
      - '**.md'
      - '**.mdx'
      - '.vale.ini'

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Vale
        uses: errata-ai/vale-action@reviewdog
        with:
          version: 3.9.1
          files: docs-rewrites/
          fail_on_error: true
          reporter: github-pr-review # Inline annotations on your PR
